<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlyOffice 协同编辑</title>
    <!-- OnlyOffice Document Server API 脚本将通过 JavaScript 动态加载 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }
        #editor {
            width: 100%;
            height: 100vh;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="editor"></div>
    <div id="loading" class="loading">正在加载编辑器...</div>

    <script>
        // 从 URL 参数获取配置
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('fileName') || 'demo.docx';
        const configUrl = urlParams.get('configUrl') || 'http://localhost:8080/onlyoffice/config?fileName=' + encodeURIComponent(fileName);
        const documentServerUrl = urlParams.get('documentServerUrl') || 'http://localhost:9000';

        // 动态加载 OnlyOffice Document Server API 脚本
        function loadOnlyOfficeScript() {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.type = 'text/javascript';
                script.src = documentServerUrl + '/web-apps/apps/api/documents/api.js';
                script.onload = resolve;
                script.onerror = () => reject(new Error('无法加载 OnlyOffice Document Server API'));
                document.head.appendChild(script);
            });
        }

        // 加载脚本并初始化编辑器
        loadOnlyOfficeScript()
            .then(() => {
                // 加载配置
                return fetch(configUrl);
            })
            .then(response => response.json())
            .then(config => {
                document.getElementById('loading').style.display = 'none';
                
                // 初始化 OnlyOffice 编辑器
                new DocsAPI.DocEditor("editor", {
                    documentType: config.documentType,
                    document: config.document,
                    editorConfig: config.editorConfig,
                    width: "100%",
                    height: "100%",
                    events: {
                        onDocumentReady: function() {
                            console.log('文档已准备就绪');
                        },
                        onError: function(error) {
                            console.error('编辑器错误:', error);
                            alert('编辑器加载失败: ' + JSON.stringify(error));
                        },
                        onInfo: function(data) {
                            console.log('编辑器信息:', data);
                        }
                    }
                });
            })
            .catch(error => {
                console.error('加载失败:', error);
                document.getElementById('loading').innerHTML = '加载失败: ' + error.message + '<br>请检查 OnlyOffice Document Server 是否运行在 ' + documentServerUrl;
            });
    </script>
</body>
</html>
