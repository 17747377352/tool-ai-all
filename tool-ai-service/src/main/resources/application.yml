server:
  port: 8080
  address: 0.0.0.0  # 监听所有网络接口，允许容器访问

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# DataAnalysis服务配置（dataAnalysis-backend项目）
data-analysis:
  # 是否启用dataAnalysis服务（优先使用dataAnalysis，失败则回退到stealer或本地实现）
  enabled: true
  # DataAnalysis服务的基础URL
  base-url: http://localhost:8000

